[package]
name = "recie"
version = "0.1.0"
description = "Local-first AI accounting assistant"
authors = ["you"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Image processing
image = "0.25"
md5 = "0.7"

# Logging
chrono = "0.4"
dirs = "5"

# Device identification
machine-uid = "0.5"

# Async runtime and HTTP
tokio = { version = "1", features = ["full"] }

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
tokio-test = "0.4"

# Optimize dependencies in dev mode for acceptable image processing speed
# Without this, Lanczos3 resize takes ~8s per image instead of <1s
[profile.dev.package."*"]
opt-level = 2

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
